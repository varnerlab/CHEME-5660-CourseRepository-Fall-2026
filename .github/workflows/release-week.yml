name: release-week
on:
  push:
    tags: ['week-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build weekly bundle
        run: |
          N="${GITHUB_REF_NAME#week-}"
          ./scripts/release-week.sh "$N"
      - name: Create release with asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "artifacts/$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --notes "Weekly bundle: unzip, then follow README setup."
